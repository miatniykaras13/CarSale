# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ads_tests
          POSTGRES_DB: ads_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ads_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore AutoCatalog
      run: dotnet restore ./src/Services/AutoCatalog/AutoCatalog.Web/AutoCatalog.Web.csproj
    - name: Build AutoCatalog
      run: dotnet build ./src/Services/AutoCatalog/AutoCatalog.Web/AutoCatalog.Web.csproj --no-restore
    # - name: Test AutoCatalog
    #   run: dotnet test ./src/Services/AutoCatalog/AutoCatalog.Web/AutoCatalog.Web.csproj --no-build --verbosity normal

    - name: Restore AdService
      run: dotnet restore ./src/Services/AdService/AdService.Web/AdService.Web.csproj
    - name: Build AdService
      run: dotnet build ./src/Services/AdService/AdService.Web/AdService.Web.csproj --no-restore
    - name: Test AdService
      env:
        AD_SERVICE_TEST_POSTGRES: Host=localhost;Port=5432;Database=ads_tests;Username=postgres;Password=ads_tests
      run: dotnet test ./src/Services/AdService/AdService.Tests/AdService.Tests.csproj --verbosity normal
